# Publica en GitHub Pages (rodjacin.github.io/Flota-dashboards) todos los dashboards MENOS MushDrink.
# MushDrink solo se sirve en Cloudflare (protegido con Cloudflare Access): en Pages, /mushdrink/
# es una página que redirige a https://flota-dashboards.kometadelivery.workers.dev/mushdrink/
# (y no contiene ningún dato).
# Requisito único: Settings → Pages → Build and deployment → Source = "GitHub Actions".
name: Publicar GitHub Pages

on:
  workflow_dispatch: {}
  push:
    branches: [main]
  schedule:
    - cron: "41 * * * *"      # respaldo horario

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar el sitio sin MushDrink
        run: |
          mkdir _site
          for f in * .nojekyll; do
            case "$f" in
              _site|automatizacion|mushdrink|dist|wrangler.jsonc|README.md) continue ;;
            esac
            cp -r "$f" _site/
          done
          mkdir -p _site/mushdrink
          cat > _site/mushdrink/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="es"><head><meta charset="utf-8">
          <meta name="robots" content="noindex">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>MushDrink - Kometa</title>
          <script>location.replace('https://flota-dashboards.kometadelivery.workers.dev/mushdrink/'+location.hash)</script>
          </head><body style="font-family:system-ui;padding:40px;color:#16302C">
          <p>El panel MushDrink se ha movido a
          <a href="https://flota-dashboards.kometadelivery.workers.dev/mushdrink/">flota-dashboards.kometadelivery.workers.dev/mushdrink/</a>
          (acceso con email).</p>
          </body></html>
          EOF
          du -sh _site; ls _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
