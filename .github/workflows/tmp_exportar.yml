# Temporal: exporta (cifrado) datos del bucket para diseñar la pestaña Rider scoring. Se borra tras usarlo.
name: tmp exportar bucket
on: { workflow_dispatch: {} }
jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: ~/Downloads/fleet_data
          key: fleet-data-none
          restore-keys: fleet-data-
      - name: Empaquetar y cifrar
        run: |
          cd ~/Downloads/fleet_data
          ls | tail -50
          find . -maxdepth 1 -type d -name '2026-*' | sort | tail -60 > d.txt
          tar czf /tmp/x.tgz billing $(sed 's|$|/batch_number=1/rider_lv.csv|' d.txt | xargs ls 2>/dev/null) $(ls -d forecast 2>/dev/null)
