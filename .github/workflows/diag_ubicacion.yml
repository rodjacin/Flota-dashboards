# TEMPORAL (diagnóstico): mide cada cuánto actualiza Glovo la ubicación de los riders y si la API
# aguanta consultas cada 30 s. Solo imprime estadísticas agregadas (sin coordenadas ni IDs). Se borra tras usarlo.
name: Diagnóstico frecuencia de ubicación
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Medir
        env: { GLOVO_KEY: "${{ secrets.GLOVO_KEY }}", TZ: Europe/Madrid }
        run: |
          pip install -q certifi
          mkdir -p "$HOME/claves-pem" "$HOME/Downloads/dashboards/en_vivo"
          printf '%s\n' "$GLOVO_KEY" | tr -d '\r' > "$HOME/claves-pem/private_key.pem"; chmod 600 "$HOME/claves-pem/private_key.pem"
          cp automatizacion/entradas/_city_ids_en_vivo.json "$HOME/Downloads/dashboards/en_vivo/city_ids.json" 2>/dev/null || true
          cd automatizacion && python3 - <<'PY'
          import time, statistics, collections, en_vivo
          last, cambios, durs, errs, quietos_falsos = {}, [], [], collections.Counter(), 0
          fin = time.time() + 12*60
          while time.time() < fin:
              t0 = time.time(); en_vivo._POS.clear()
              snap = en_vivo._descargar(["ALC","GRA","MAD","NOM","SAB"])
              durs.append(time.time() - t0)
              for e in snap.get("errors") or []: errs[e.split(":")[-1].strip()[:40]] += 1
              for rid, p in en_vivo._POS.items():
                  la = p.get("loc_at")
                  if not la: continue
                  if rid in last and last[rid] != la:
                      import datetime as dt
                      a = dt.datetime.fromisoformat(last[rid][:26].rstrip("Z")); b = dt.datetime.fromisoformat(la[:26].rstrip("Z"))
                      cambios.append((b - a).total_seconds() / 60)
                  last[rid] = la
              time.sleep(max(0, 30 - (time.time() - t0)))
          c = sorted(cambios); n = len(c)
          print("muestras:", len(durs), "· duración por muestra (s): media %.1f, máx %.1f" % (statistics.mean(durs), max(durs)))
          print("errores:", dict(errs) or "ninguno")
          print("riders con posición:", len(last), "· cambios de ubicación observados:", n)
          if n:
              print("intervalo entre actualizaciones de ubicación (min) p10/p25/p50/p75/p90:",
                    [round(c[int(n*q)], 2) for q in (.1, .25, .5, .75, .9)])
              print("histograma (min):", sorted(collections.Counter(min(int(x), 10) for x in c).items()))
          PY
