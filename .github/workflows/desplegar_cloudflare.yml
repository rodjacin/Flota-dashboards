# Publica los paneles (MushDrink, GRA-MAD-NOM-ALC, SAB) en Cloudflare Workers, protegidos con Cloudflare Access.
# Se lanza al terminar las actualizaciones automáticas, cada 15 min (para las paradas en vivo) y a mano.
# Necesita dos secretos en GitHub (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token con la plantilla «Edit Cloudflare Workers»
#   CLOUDFLARE_ACCOUNT_ID  ID de la cuenta de Cloudflare
#   DATOS_TOKEN            token de GitHub con acceso al repo privado rodjacin/mushdrink-datos (datos del panel)
# Sin ellos, el job termina sin hacer nada.
name: "Publicar en Cloudflare"

on:
  workflow_dispatch: {}
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_run:
    workflows: ["MushDrink · día de ayer", "Actualizar dashboards de flota"]
    types: [completed]
  push:
    branches: [main]
    paths: ["gra-mad-nom-alc/**", "sab/**", "index.html", "wrangler.jsonc", "automatizacion/build_cloudflare.py"]

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: ¿Configurado?
        id: chk
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then echo "ok=1" >> "$GITHUB_OUTPUT";
          else echo "::notice::Faltan CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID: no se publica en Cloudflare."; echo "ok=0" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.chk.outputs.ok == '1'
        with:
          ref: main

      - name: Datos privados de MushDrink (rodjacin/mushdrink-datos)
        if: steps.chk.outputs.ok == '1'
        uses: actions/checkout@v4
        with:
          repository: rodjacin/mushdrink-datos
          token: ${{ secrets.DATOS_TOKEN }}
          path: .datos

      - name: Enlazar mushdrink/ con los datos privados
        if: steps.chk.outputs.ok == '1'
        run: |
          test -s .datos/mushdrink/index.html || { echo "::error::Sin datos de MushDrink: no se publica"; exit 1; }
          rm -rf mushdrink && ln -s .datos/mushdrink mushdrink

      - uses: actions/setup-python@v5
        if: steps.chk.outputs.ok == '1'
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        if: steps.chk.outputs.ok == '1'
        with:
          node-version: "22"

      - name: Construir dist/
        if: steps.chk.outputs.ok == '1'
        run: python3 automatizacion/build_cloudflare.py

      - name: Publicar en Cloudflare Workers
        if: steps.chk.outputs.ok == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
