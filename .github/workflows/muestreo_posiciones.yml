# Toma cada 5 min la posición de los riders (Live Operations) y la guarda en un historial
# PRIVADO (caché de GitHub Actions, nunca en el repo ni en la web). Con él calcula cuánto
# lleva cada rider parado con un pedido activo y publica SOLO esos minutos en
# <dashboard>/wtd_vivo.json, que la pestaña WTD% relee sin regenerar el dashboard.
#
# Las ejecuciones programadas de GitHub cada pocos min no son fiables (se saltan muchas), así
# que cada ejecución se queda ~55 min en marcha tomando una muestra cada 5 min (publica cada
# 10 min: GitHub Pages admite ~10 publicaciones por hora) y al acabar
# se relanza a sí misma. La programación horaria solo es un respaldo si la cadena se corta
# (la concurrencia garantiza que nunca haya dos a la vez).
name: Muestreo de posiciones

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}
  push:                       # al cambiar este fichero arranca la cadena al momento
    branches: [main]
    paths: [".github/workflows/muestreo_posiciones.yml"]

permissions:
  contents: write
  actions: write

concurrency:
  group: muestreo-posiciones
  cancel-in-progress: false

jobs:
  muestrear:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recuperar historial de posiciones
        uses: actions/cache@v4
        with:
          path: ~/Downloads/dashboards/posiciones
          key: posiciones-${{ github.run_id }}
          restore-keys: posiciones-

      - name: Muestrear cada 5 min y publicar cada 10 min (~55 min)
        env:
          GLOVO_KEY: ${{ secrets.GLOVO_KEY }}
          TZ: Europe/Madrid
        run: |
          pip install -q certifi
          mkdir -p "$HOME/claves-pem" "$HOME/Downloads/dashboards/en_vivo"
          printf '%s\n' "$GLOVO_KEY" | tr -d '\r' > "$HOME/claves-pem/private_key.pem"
          chmod 600 "$HOME/claves-pem/private_key.pem"
          cp automatizacion/entradas/_city_ids_en_vivo.json "$HOME/Downloads/dashboards/en_vivo/city_ids.json" 2>/dev/null || true
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          publicar() {
            for f in gra-mad-nom-alc/wtd_vivo.json sab/wtd_vivo.json gra-mad-nom-alc/wtd_v1_hist.json sab/wtd_v1_hist.json; do
              [ -f "$f" ] && git add "$f"
            done
            if git diff --cached --quiet; then echo "Sin cambios."; return 0; fi
            git commit -q -m "Paradas en vivo $(date '+%d/%m/%Y %H:%M')"
            for i in 1 2 3; do
              git pull --rebase -q && git push -q && echo "Publicado OK." && return 0
              sleep 10
            done
            echo "No se pudo publicar esta muestra (se reintenta en la siguiente)"
            git reset -q --hard origin/main 2>/dev/null || true
          }

          FIN=$(( $(date +%s) + 55*60 ))
          while :; do
            echo "==== $(date '+%H:%M:%S') muestra ===="
            python3 automatizacion/posiciones.py "$GITHUB_WORKSPACE" || echo "fallo en la muestra (se reintenta en la siguiente)"
            # publica en las muestras de los minutos 0-4 de cada decena (cada ~10 min)
            [ $(( 10#$(date +%M) % 10 )) -lt 5 ] && publicar
            AHORA=$(date +%s)
            ESPERA=$(( 300 - AHORA % 300 ))            # siguiente múltiplo de 5 min
            [ $(( AHORA + ESPERA )) -ge $FIN ] && break
            sleep $ESPERA
          done

      - name: Relanzar el muestreo
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run muestreo_posiciones.yml --ref "${{ github.ref_name }}" && echo "Siguiente tanda lanzada"
