# Toma cada minuto la posición de los riders (Live Operations) y la guarda en un historial
# PRIVADO (caché de GitHub Actions, nunca en el repo ni en la web). Con él calcula cuánto
# lleva cada rider parado con un pedido activo y publica SOLO esos minutos en
# <dashboard>/wtd_vivo.json, que la pestaña WTD% relee sin regenerar el dashboard.
#
# Las ejecuciones programadas de GitHub cada pocos min no son fiables (se saltan muchas), así
# que cada ejecución se queda ~55 min en marcha tomando una muestra cada minuto. Cada muestra se
# publica al momento en la rama «vivo» (solo los JSON en vivo, un fichero por minuto, sin historial:
# no pasa por GitHub Pages) y la pestaña WTD% v1 la lee de raw.githubusercontent.com; además se
# publica en la web cada 10 min (GitHub Pages admite ~10 publicaciones por hora) y al acabar
# se relanza a sí misma. La programación horaria solo es un respaldo si la cadena se corta
# (la concurrencia garantiza que nunca haya dos a la vez).
name: Muestreo de posiciones

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}
  push:                       # al cambiar este fichero arranca la cadena al momento
    branches: [main]
    paths: [".github/workflows/muestreo_posiciones.yml"]

permissions:
  contents: write
  actions: write

concurrency:
  group: muestreo-posiciones
  cancel-in-progress: false

jobs:
  muestrear:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recuperar historial de posiciones
        uses: actions/cache@v4
        with:
          path: ~/Downloads/dashboards/posiciones
          key: posiciones-${{ github.run_id }}
          restore-keys: posiciones-

      - name: Muestrear cada minuto, publicar en «vivo» al momento y en la web cada 10 min (~55 min)
        env:
          GLOVO_KEY: ${{ secrets.GLOVO_KEY }}
          GH_TOKEN: ${{ github.token }}
          TZ: Europe/Madrid
        run: |
          pip install -q certifi
          mkdir -p "$HOME/claves-pem" "$HOME/Downloads/dashboards/en_vivo"
          printf '%s\n' "$GLOVO_KEY" | tr -d '\r' > "$HOME/claves-pem/private_key.pem"
          chmod 600 "$HOME/claves-pem/private_key.pem"
          cp automatizacion/entradas/_city_ids_en_vivo.json "$HOME/Downloads/dashboards/en_vivo/city_ids.json" 2>/dev/null || true
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          publicar() {
            for f in gra-mad-nom-alc/wtd_vivo.json sab/wtd_vivo.json gra-mad-nom-alc/wtd_v1_hist.json sab/wtd_v1_hist.json gra-mad-nom-alc/liveops_hist.json sab/liveops_hist.json; do
              [ -f "$f" ] && git add "$f"
            done
            if git diff --cached --quiet; then echo "Sin cambios."; return 0; fi
            git commit -q -m "Paradas en vivo $(date '+%d/%m/%Y %H:%M')"
            for i in 1 2 3; do
              git pull --rebase -q && git push -q && echo "Publicado OK." && return 0
              sleep 10
            done
            echo "No se pudo publicar esta muestra (se reintenta en la siguiente)"
            git reset -q --hard origin/main 2>/dev/null || true
          }

          # Rama «vivo»: un commit huérfano que se reescribe en cada muestra con los últimos ~15 min.
          # Un nombre de fichero por minuto (<dashboard>/m/<minuto epoch>.json) porque raw.githubusercontent
          # guarda cada URL 5 min en caché: así cada minuto es una URL nueva y llega al momento.
          VIVO="$RUNNER_TEMP/vivo"; mkdir -p "$VIVO"
          REMOTO="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          publicar_vivo() {
            local M=$1
            for c in gra-mad-nom-alc sab; do
              [ -f "$c/wtd_vivo.json" ] || continue
              mkdir -p "$VIVO/$c/m"; cp "$c/wtd_vivo.json" "$VIVO/$c/m/$M.json"
              find "$VIVO/$c/m" -name '*.json' -mmin +15 -delete
            done
            ( cd "$VIVO" && rm -rf .git && git init -q -b vivo && git add -A \
              && git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "vivo $M" \
              && git push -qf "$REMOTO" vivo ) && echo "vivo $M publicado" || echo "no se pudo publicar en vivo $M"
          }

          FIN=$(( $(date +%s) + 55*60 ))
          while :; do
            M=$(( $(date +%s) / 60 ))
            echo "==== $(date '+%H:%M:%S') muestra ===="
            if python3 automatizacion/posiciones.py "$GITHUB_WORKSPACE"; then publicar_vivo $M; else echo "fallo en la muestra (se reintenta en la siguiente)"; fi
            # publica en la web en la muestra del minuto 0 de cada decena (cada ~10 min)
            [ $(( 10#$(date +%M) % 10 )) -eq 0 ] && publicar
            AHORA=$(date +%s)
            ESPERA=$(( 60 - AHORA % 60 ))              # siguiente minuto en punto
            [ $(( AHORA + ESPERA )) -ge $FIN ] && break
            sleep $ESPERA
          done

      - name: Relanzar el muestreo
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run muestreo_posiciones.yml --ref "${{ github.ref_name }}" && echo "Siguiente tanda lanzada"
