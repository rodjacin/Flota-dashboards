# Toma cada 10 min la posición de los riders (Live Operations) y la guarda en un historial
# PRIVADO (caché de GitHub Actions, nunca en el repo ni en la web). Con él calcula cuánto
# lleva cada rider parado con un pedido activo y publica SOLO esos minutos en
# <dashboard>/wtd_vivo.json, que la pestaña WTD% relee sin regenerar el dashboard.
# GitHub puede retrasar unos minutos las ejecuciones programadas.
name: Muestreo de posiciones

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: muestreo-posiciones
  cancel-in-progress: false

jobs:
  muestrear:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recuperar historial de posiciones
        uses: actions/cache@v4
        with:
          path: ~/Downloads/dashboards/posiciones
          key: posiciones-${{ github.run_id }}
          restore-keys: posiciones-

      - name: Tomar muestra
        env:
          GLOVO_KEY: ${{ secrets.GLOVO_KEY }}
          TZ: Europe/Madrid
        run: |
          pip install -q certifi
          mkdir -p "$HOME/claves-pem" "$HOME/Downloads/dashboards/en_vivo"
          printf '%s\n' "$GLOVO_KEY" | tr -d '\r' > "$HOME/claves-pem/private_key.pem"
          chmod 600 "$HOME/claves-pem/private_key.pem"
          cp automatizacion/entradas/_city_ids_en_vivo.json "$HOME/Downloads/dashboards/en_vivo/city_ids.json" 2>/dev/null || true
          python3 automatizacion/posiciones.py "$GITHUB_WORKSPACE"

      - name: Publicar paradas (wtd_vivo.json)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gra-mad-nom-alc/wtd_vivo.json sab/wtd_vivo.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Sin cambios."; exit 0; fi
          git commit -q -m "Paradas en vivo $(TZ=Europe/Madrid date '+%d/%m/%Y %H:%M')"
          for i in 1 2 3; do
            git pull --rebase -q && git push -q && echo "Publicado OK." && exit 0
            sleep 10
          done
          echo "No se pudo publicar"; exit 1
